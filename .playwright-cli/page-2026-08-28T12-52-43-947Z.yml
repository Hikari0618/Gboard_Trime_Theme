              - button "Outline" [ref=e407] [cursor=pointer]
            - article [ref=e411]:
              - generic [ref=e412]:
                - heading "语燕输入法" [level=1] [ref=e413]
                - 'link "Permalink: 语燕输入法" [ref=e414] [cursor=pointer]':
                  - /url: "#语燕输入法"
              - paragraph [ref=e417]:
                - text: 雨燕以其敏捷、优雅的飞行姿态，在雨天依然够飞翔、不畏艰险、勇往直前的飞翔态度，被赋予
                - strong [ref=e418]: 灵巧、聪明、伶俐、积极、创新
                - text: 的寓意。语言是人类交流的基本工具，是最重要的文化载体，输入方式是语言交流和信息传递的重要环节，使语言交流变得更加
                - strong [ref=e419]: 高效、便捷
                - text: 。
                - link "语燕输入法" [ref=e420] [cursor=pointer]:
                  - /url: https://github.com/gurecn/YuyanIme
                - text: 秉承这些特点，以“
                - strong [ref=e421]: 易用、快速、准确
                - text: ”为核心理念，追求极致、卓越、流畅的输入体验。 在设计上，语燕输入法借鉴主流的谷歌拼音、微信输入法等主流输入法精华，追求整体简洁大方，易于上手。支持多种输入方式，规划包括拼音、手写、语音等，满足不同用户的输入需求。支持丰富的个性化设置选项，用户可以根据自己的喜好进行自定义设置，让输入更加符合个人习惯。
              - generic [ref=e422]:
                - heading "安装使用：" [level=2] [ref=e423]
                - 'link "Permalink: 安装使用：" [ref=e424] [cursor=pointer]':
                  - /url: "#安装使用"
              - paragraph [ref=e427]:
                - text: 华为应用市场：
                - link "应用地址" [ref=e428] [cursor=pointer]:
                  - /url: https://appgallery.cloud.huawei.com/appDetail?pkgName=com.yuyan.pinyin.online.release
                - text: ，应用宝：
                - link "应用地址" [ref=e429] [cursor=pointer]:
                  - /url: https://sj.qq.com/appdetail/com.yuyan.pinyin.online.release
                - text: ，已上架语燕输入法，可直接搜索安装。 也可以直接点击
                - link "Github Releases" [ref=e430] [cursor=pointer]:
                  - /url: https://github.com/gurecn/YuyanIme/releases
                - text: ，下载最新版本安装包直接安装使用。 国内访问Github慢的话，可点击
                - link "Gitee Releases" [ref=e431] [cursor=pointer]:
                  - /url: https://gitee.com/gurecn/YuyanIme/releases
                - text: 下载。 手机扫码下载地址：
              - table [ref=e433]:
                - rowgroup [ref=e434]:
                  - row [ref=e435]:
                    - columnheader "Github" [ref=e436]
                    - columnheader "Gitee" [ref=e437]
                - rowgroup [ref=e438]:
                  - row [ref=e439]:
                    - cell [ref=e440]:
                      - link [ref=e441] [cursor=pointer]:
                        - /url: /Hikari0618/YuyanIme/blob/master/images/download/github.png
                        - img "github" [ref=e442]
                    - cell [ref=e443]:
                      - link [ref=e444] [cursor=pointer]:
                        - /url: /Hikari0618/YuyanIme/blob/master/images/download/gitee.png
                        - img "gitee" [ref=e445]
              - paragraph [ref=e446]: 使用过程中任何问题可以创建issues、应用内反馈或通过邮件等方式反馈，本人会根据需求及时修复。
              - generic [ref=e447]:
                - heading "设计原则：" [level=2] [ref=e448]
                - 'link "Permalink: 设计原则：" [ref=e449] [cursor=pointer]':
                  - /url: "#设计原则"
              - generic [ref=e452]:
                - heading "纯输入功能，主打轻快。" [level=3] [ref=e453]
                - 'link "Permalink: 纯输入功能，主打轻快。" [ref=e454] [cursor=pointer]':
                  - /url: "#纯输入功能主打轻快"
              - paragraph [ref=e457]:
                - text: 喜欢简洁的我看到一个个拼音输入法工具软件逐渐趋向繁杂，软件内各种眼花缭乱的无用功能以及烦人的广告让我无法忍受。
                - strong [ref=e458]: 因此我想要定制出一款简洁、实用、好用的输入法；
              - generic [ref=e459]:
                - heading "最小、必要的权限原则，更安全。" [level=3] [ref=e460]
                - 'link "Permalink: 最小、必要的权限原则，更安全。" [ref=e461] [cursor=pointer]':
                  - /url: "#最小必要的权限原则更安全"
              - paragraph [ref=e464]:
                - text: 当前主流输入法获取各类非必要权限，无视用户隐私，随意上传、分析用户数据。虽然大数据不会区别对待，但我仍然希望自己的数据只在自己的手机里，不要在我不知情、无意识的情况下，把所有数据上传。
                - strong [ref=e465]: 语燕输入法谨遵循必要、最小化权限，只为输入而存在，纯净、安全、更高效。
                - text: 语燕输入法仅使用系统默认为输入法开启的
                - code [ref=e466]: 剪贴板
                - text: （剪贴板功能）、
                - code [ref=e467]: 设备运动与方向
                - text: （屏幕方向变更）、
                - code [ref=e468]: 媒体音控制
                - text: （按键音效）、
                - code [ref=e469]: 振动
                - text: （按键振动）权限，不获取网络、存储、位置、辅助功能等其他权限，完全离线不上传云端，输入数据不采集、不记录，不访问任何个人、终端、位置、存储等信息。
              - generic [ref=e470]:
                - heading "基于Rime引擎，但更易上手。" [level=3] [ref=e471]
                - 'link "Permalink: 基于Rime引擎，但更易上手。" [ref=e472] [cursor=pointer]':
                  - /url: "#基于rime引擎但更易上手"
              - paragraph [ref=e475]:
                - text: 当前开放的输入法引擎中，
                - link "Rime引擎" [ref=e476] [cursor=pointer]:
                  - /url: https://github.com/rime/librime
                - text: 已经趋向完善。然后对于小白用户来说，上手却并不容易：各种输入方案定制及兼容问题，各种键盘的界面效果优化问题。
                - strong [ref=e477]: 因此我想要定制出一款基于Rime引擎的安装即用，哪怕没时间研究也能好用的输入法；
              - generic [ref=e478]:
                - heading "输入模式更完善。" [level=3] [ref=e479]
                - 'link "Permalink: 输入模式更完善。" [ref=e480] [cursor=pointer]':
                  - /url: "#输入模式更完善"
              - paragraph [ref=e483]:
                - text: 最早接触安卓平台的
                - link "同文输入法" [ref=e484] [cursor=pointer]:
                  - /url: https://github.com/osfans
                - text: ，后面接触
                - link "小企鹅输入法" [ref=e485] [cursor=pointer]:
                  - /url: https://github.com/fcitx5-android/fcitx5-android
                - text: ，均采用Rime方案进行定制，在输入层面已经满足大部分需求。但是小企鹅输入法九宫格键盘不支持，同文输入法候选词选择不便且无法选择拼音组合，使用起来确实需要勇气。 语燕输入法内置多套优秀词库，优化Rime九宫输入方案、乱序输入方案，支持绝大部分输出场景，提升输入效率。
                - strong [ref=e486]: 因此我想定制出一款支持对小白用户来说使用更普及的九宫格，同时结合全键、双拼、手写、语音等多种方案的输入法。
              - generic [ref=e487]:
                - heading "个性化定制更贴心。" [level=3] [ref=e488]
                - 'link "Permalink: 个性化定制更贴心。" [ref=e489] [cursor=pointer]':
                  - /url: "#个性化定制更贴心"
              - paragraph [ref=e492]: 手机屏幕越来越大，但是在走路时，一手提东西，一手打字回复消息对我来说是个头疼地问题，选择候选词够不到、选择出错屡屡出现，因此我定制了单手模式、悬浮键盘。 输入数字要么切换到数字键盘，要么长按按键输入，对输入来说都不便捷，因此我定制了键盘数字行。 夜间输入时，屏幕刺眼，因此我定制了深色主题自动切换功能。更多贴心定制项正在进行中。
              - generic [ref=e493]:
                - heading "实现功能：" [level=2] [ref=e494]
                - 'link "Permalink: 实现功能：" [ref=e495] [cursor=pointer]':
                  - /url: "#实现功能"
              - list [ref=e498]:
                - listitem [ref=e499]: 方案内置：全拼（九宫格、全键）、双拼(小鹤、智能ABC、自然码、紫光、微软、搜狗、乱序17)、手写、五笔画；支持简拼、全拼；
                - listitem [ref=e500]: 英文输入：智能全键英文输入；
                - listitem [ref=e501]: 词库拓展：支持雾凇词库、白霜词库等多种词库拓展，输入体验良好；
                - listitem [ref=e502]: 符号输入：中文、英文、数学、颜文字、EMOJI表情输入、微信特效表情；
                - listitem [ref=e503]: 数字输入：数字键盘输入、键盘数字行输入；
                - listitem [ref=e504]: 键盘自定义：自定义菜单栏、主题、深色模式、键盘调节、键盘数字行、键盘位置移动；
                - listitem [ref=e505]: 单手键盘：左、右手模式切换；
                - listitem [ref=e506]: 悬浮键盘：悬浮键盘模式，键盘拖拽、移动；
                - listitem [ref=e507]: 花漾字输入：火星文（焱暒妏）、 花藤字（ζั͡花ั͡藤ั͡字ั͡✾）、凌乱字（"҉҉҉凌҉҉҉乱҉҉҉字҉҉҉）、发芽字（发ོ芽ོ字ོ）、雾霾字（҈҈҈҈雾҈҈҈҈霾҈҈҈҈字҈҈҈҈）、禁止查看（禁⃠止⃠查⃠看⃠）、长草字（"҈长҉҉҈草҉҉҈字҉）、起风了（=͟͟͞͞风=͟͟͞͞太=͟͟͞͞大=͟͟͞͞）花漾输入；
                - listitem [ref=e508]: 拼音输入扩展：支持繁体、简体，支持中英文混输，支持表情描述输入；
                - listitem [ref=e509]: 剪切板：支持剪切板联想显示、剪切板及清空操作；
                - listitem [ref=e510]: 常用语：支持自定义常用语、常用语快捷输入、编辑、删除等操作；
                - listitem [ref=e511]: 全面屏键盘优化：支持全面屏键盘优化导航栏功能；
                - listitem [ref=e512]: 隐藏输入法图标：支持隐藏输入法图标功能。
              - generic [ref=e513]:
                - heading "已知问题：" [level=2] [ref=e514]
                - 'link "Permalink: 已知问题：" [ref=e515] [cursor=pointer]':
                  - /url: "#已知问题"
              - list [ref=e518]:
